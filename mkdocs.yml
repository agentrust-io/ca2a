site_name: cA2A
site_description: Verify signed delegation chains and peer trust evidence for A2A. Start with a local grant and scope-escalation check.
site_url: https://ca2a.agentrust-io.com
repo_url: https://github.com/agentrust-io/ca2a
repo_name: agentrust-io/ca2a
edit_uri: edit/main/
docs_dir: .
exclude_docs: |
  .github/
  hooks/
  node_modules/
  benchmarks/
  src/
  tests/
  schemas/
  examples/
  LICENSE
  NOTICE
  README.md
  ADOPTERS.md
  MAINTAINERS.md
  pyproject.toml
  .gitignore

theme:
  name: material
  font: false
  logo: docs/assets/icon.svg
  favicon: docs/assets/icon.svg
  custom_dir: overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

hooks:
  # Per-page meta descriptions; see the module docstring.
  - hooks/seo.py

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        cA2A adds signed delegation, peer appraisal, sealed channels, and linked
        provenance to A2A communication. Begin with offline grant verification
        against a separately trusted root. Live runtime checks and hardware
        assurance require additional evidence and explicit relying-party policy.
        Part of AgenTrust, open specifications for verifiable AI: https://agentrust-io.com.
      sections:
        Get started:
          - index.md
          - docs/quickstart.md
          - docs/concepts.md
          - docs/configuration.md
        Specification:
          - docs/SPEC.md
          - docs/spec/profile.md
          - docs/spec/delegation-chain.md
          - docs/spec/sealed-channel.md
          - docs/spec/attestation.md
          - docs/spec/mutual-attestation.md
          - docs/spec/conformance.md
          - docs/spec/error-codes.md
          - docs/spec/threat-model.md
        Guides:
          - docs/tutorials/verify-a-delegation-chain.md
          - docs/tutorials/authoring-a-delegation-credential.md
          - docs/tutorials/emit-and-verify-provenance.md
          - docs/tutorials/reproducing-the-claims.md
          - docs/tutorials/integrating-with-a2a.md
          - docs/hardware-validation.md
        Project:
          - LIMITATIONS.md
          - ROADMAP.md
          - GOVERNANCE.md
          - SECURITY.md
  - minify:
      minify_html: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            unwrap_annotated: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/agentrust-io/
      name: AgenTrust on LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/agentrust-io/ca2a
  generator: false

extra_css:
  # Shared AgenTrust editorial design system. Deliberately the only stylesheet:
  # a local override here is how this site drifted to the Material default
  # violet last time. Change the shared file instead.
  # The ?v= matches CSS_VERSION in agentrust-io.github.io tools/site_header.py. Browsers keep these files for hours, so bump it there and here together.
  - https://agentrust-io.com/design-system.css?v=22

nav:
  - Home: index.md
  - Get started:
      - Quick start: docs/quickstart.md
      - How it works: docs/concepts.md
      - Configuration: docs/configuration.md
  - Specification:
      - Overview: docs/SPEC.md
      - Profile and transport:
          - A2A profile: docs/spec/profile.md
          - Transport binding: docs/spec/transport.md
          - Response binding (proposal): docs/spec/response-binding-requirements.md
          - Live response authentication: docs/spec/response-authentication.md
          - Sealed peer channel: docs/spec/sealed-channel.md
          - TRACE A2A profile: docs/spec/trace-a2a-profile.md
      - Delegation and policy:
          - Delegation chain: docs/spec/delegation-chain.md
          - Scope-policy intersection: docs/spec/cedar-policy.md
          - Inbound peer-call decision: docs/spec/call-graph.md
          - Provenance DAG: docs/spec/provenance-dag.md
      - Attestation:
          - Component model: docs/spec/component-model.md
          - Attestation: docs/spec/attestation.md
          - Mutual attestation: docs/spec/mutual-attestation.md
          - Verification library: docs/spec/verification-library.md
      - Conformance and failure:
          - Conformance: docs/spec/conformance.md
          - Error codes: docs/spec/error-codes.md
          - Failure modes: docs/spec/failure-modes.md
          - Threat model: docs/spec/threat-model.md
  - Guides:
      - Verify a delegation chain: docs/tutorials/verify-a-delegation-chain.md
      - Authoring a delegation credential: docs/tutorials/authoring-a-delegation-credential.md
      - Emit and verify provenance: docs/tutorials/emit-and-verify-provenance.md
      - Reproducing the claims: docs/tutorials/reproducing-the-claims.md
      - Integrating with A2A: docs/tutorials/integrating-with-a2a.md
      - Hardware validation: docs/hardware-validation.md
  - Project:
      - Limitations: LIMITATIONS.md
      - Roadmap: ROADMAP.md
      - Governance: GOVERNANCE.md
      - Technical charter: CHARTER.md
      - Sponsors: SPONSORS.md
      - Contributing: CONTRIBUTING.md
      - Changelog: CHANGELOG.md
      - Security: SECURITY.md
      - Code of conduct: CODE_OF_CONDUCT.md
      - Privacy: PRIVACY.md

extra_javascript:
  # Shared cross-project top navigation (TRACE / Manifest / cMCP / cA2A / ...)
  # The ?v= matches CSS_VERSION in agentrust-io.github.io tools/site_header.py. Browsers keep these files for hours, so bump it there and here together.
  - https://agentrust-io.com/supernav.js?v=22
