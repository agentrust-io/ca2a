name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install build twine

      - name: Verify release tag matches package version
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install and smoke-test wheel
        run: |
          python -m venv /tmp/ca2a-wheel
          /tmp/ca2a-wheel/bin/python -m pip install dist/*.whl
          /tmp/ca2a-wheel/bin/python -c 'import importlib.metadata, ca2a_runtime; expected="${{ github.ref_name }}"[1:]; assert importlib.metadata.version("ca2a-runtime") == expected; assert ca2a_runtime.__version__ == expected'
          /tmp/ca2a-wheel/bin/ca2a --help

      - name: Install and smoke-test source distribution
        run: |
          python -m venv /tmp/ca2a-sdist
          /tmp/ca2a-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/ca2a-sdist/bin/python -c 'import importlib.metadata, ca2a_runtime; expected="${{ github.ref_name }}"[1:]; assert importlib.metadata.version("ca2a-runtime") == expected; assert ca2a_runtime.__version__ == expected'
          /tmp/ca2a-sdist/bin/ca2a --help

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC trusted publishing, no API tokens
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  governance-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e "."

      # Isolate AGT's tooling dependencies from the release artifact. AGT 4.1
      # constrains cryptography below 49; cA2A requires 50+ security fixes. The
      # ephemeral scanner is upgraded too so the release gate runs no known-
      # vulnerable cryptography build while that upstream bound is stale.
      - name: Install governance tooling in an isolated environment
        run: |
          python -m venv .agt-venv
          .agt-venv/bin/pip install "agent-governance-toolkit[full]>=4.1"
          .agt-venv/bin/pip install --upgrade --no-deps "cryptography>=50.0"

      - name: Generate evidence file
        run: python scripts/gen_agt_evidence.py

      - name: AGT governance verify (strict)
        run: .agt-venv/bin/agt verify --evidence agt-evidence.json

      - name: Save attestation JSON
        run: .agt-venv/bin/agt --json verify --evidence agt-evidence.json > agt-attestation.json

      - name: Attach evidence to release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.ref_name }} agt-evidence.json agt-attestation.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
