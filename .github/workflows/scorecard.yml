name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1'
  push:
    branches:
      - main

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    # Scorecard requires a public repo. Skip (neutral) while private; this runs
    # for real once the repo is made public at launch.
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # The repo is public; publish results to the OpenSSF Scorecard API so
          # the README badge resolves.
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard-results.sarif
